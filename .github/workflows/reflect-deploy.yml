name: Reflect — deploy

# Deploy the fork to Reflect's self-hosted worker.
#
# Merging a reflect-upstream-watch PR is the intent to ship; the `production`
# environment's required reviewer is the last look before production D1 is
# migrated. Nothing here runs without that approval.
#
# Order matters: .reflect/apply-resources.mjs MUST run before `pnpm run deploy`,
# because that script is `db:migrate:prod && build && wrangler deploy` and the
# migrate step reads database_id and migrations_dir out of wrangler.jsonc. A
# deploy that skips it migrates upstream's D1, not ours.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - runbooks/**
      - .agents/**
      - web/**
      - badseo/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reflect-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'sebastian-reflectmedia/open-seo'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REFLECT_KV_ID: ${{ secrets.REFLECT_KV_ID }}
      REFLECT_OAUTH_KV_ID: ${{ secrets.REFLECT_OAUTH_KV_ID }}
      REFLECT_D1_NAME: ${{ secrets.REFLECT_D1_NAME }}
      REFLECT_D1_ID: ${{ secrets.REFLECT_D1_ID }}
      REFLECT_R2_BUCKET: ${{ secrets.REFLECT_R2_BUCKET }}
      OPENSEO_URL: ${{ vars.OPENSEO_URL || 'https://open-seo.reflectmedia.workers.dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard-fails if any of the six values did not land exactly once, or if
      # upstream renamed a binding. Failing here is the point.
      - name: Point config at Reflect resources
        run: node .reflect/apply-resources.mjs

      - name: Capture a D1 restore point
        id: restore
        run: |
          set -euo pipefail
          bookmark=$(pnpm exec wrangler d1 time-travel info "$REFLECT_D1_NAME" --json \
            | jq -r '.bookmark // empty')
          if [ -z "$bookmark" ]; then
            echo "::error::could not read a Time Travel bookmark — refusing to migrate blind"
            exit 1
          fi
          echo "bookmark=$bookmark" >> "$GITHUB_OUTPUT"
          echo "Restore point: $bookmark"

      - name: Export D1
        run: |
          set -euo pipefail
          mkdir -p /tmp/d1
          pnpm exec wrangler d1 export "$REFLECT_D1_NAME" --remote --output /tmp/d1/open-seo-reflect.sql
          ls -lh /tmp/d1/

      - name: Upload D1 export
        uses: actions/upload-artifact@v4
        with:
          name: d1-export-${{ github.sha }}
          path: /tmp/d1/open-seo-reflect.sql
          retention-days: 30

      # db:migrate:prod && build && wrangler deploy
      - name: Deploy
        run: pnpm run deploy

      # The anonymous assertion is the valuable one. A deploy that quietly drops
      # Access protection looks completely normal from the inside, and a 200 here
      # means the full MCP surface — with DataForSEO credentials injected
      # server-side — is answering to the open internet.
      - name: Smoke test — anonymous request must NOT be served
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$OPENSEO_URL/")
          echo "anonymous GET / -> $code"
          case "$code" in
            302|303|401|403) echo "Access is protecting the origin." ;;
            200) echo "::error::anonymous request returned 200 — Access is NOT protecting this worker"; exit 1 ;;
            *) echo "::error::unexpected status $code from anonymous request"; exit 1 ;;
          esac

      - name: Smoke test — service token must be served
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CF_ACCESS_CLIENT_ID:-}" ]; then
            echo "::warning::no Zero Trust service token configured — skipping the authenticated check."
            echo "Add a Service Auth policy to the OpenSEO Access app and set CF_ACCESS_CLIENT_ID/SECRET."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "$OPENSEO_URL/")
          echo "authenticated GET / -> $code"
          [ "$code" = "200" ] || { echo "::error::authenticated request returned $code, expected 200"; exit 1; }

      - name: Rollback instructions
        if: failure()
        env:
          BOOKMARK: ${{ steps.restore.outputs.bookmark }}
        run: |
          echo "Deploy failed. Two independent rollbacks, code first:"
          echo ""
          echo "  pnpm exec wrangler rollback"
          echo ""
          if [ -n "${BOOKMARK:-}" ]; then
            echo "  # only if a migration corrupted data — this is destructive and an outage"
            echo "  pnpm exec wrangler d1 time-travel restore \"$REFLECT_D1_NAME\" --bookmark=$BOOKMARK"
          else
            echo "  # no bookmark was captured — the run failed before the restore point"
          fi
          echo ""
          echo "A full SQL export is attached to this run as d1-export-${{ github.sha }}."
